    <script>
      // Loading screen on every visit, decided before first paint. Timing lives in src/lib/intro.ts.
      (function () {
        var root = document.documentElement;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          root.classList.add("intro-skip");
          return;
        }
        root.classList.add("intro-running");
        // Safety net: if the app script never releases the screen, release it here.
        setTimeout(function () {
          if (!root.classList.contains("intro-running")) return;
          root.classList.remove("intro-running");
        }, 4000);
      })();
    </script>
